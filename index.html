<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мемо</title>
<meta name="theme-color" content="#0d3b66">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#f4f6fa; --card:#fff; --ink:#12233d; --muted:#5d718f; --line:#dde5ef;
  --blue:#0d3b66; --acc:#2f7ce0; --ok:#1f9d55; --bad:#d24a3d; --gold:#c9922b;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg); color:var(--ink); font-size:16px; line-height:1.45;
  padding-bottom:calc(72px + env(safe-area-inset-bottom));
}
header{
  position:sticky; top:0; z-index:20; background:var(--blue); color:#fff;
  padding:12px 16px calc(12px + env(safe-area-inset-top,0)) 16px;
  padding-top:calc(12px + env(safe-area-inset-top,0));
  box-shadow:0 2px 10px rgba(13,59,102,.25);
}
header h1{margin:0; font-size:17px; font-weight:600; letter-spacing:.2px}
header .sub{font-size:12px; opacity:.75; margin-top:2px}
main{max-width:760px; margin:0 auto; padding:14px 12px 24px}
nav{
  position:fixed; left:0; right:0; bottom:0; z-index:30; display:flex;
  background:#fff; border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
nav button{
  flex:1; border:0; background:none; padding:9px 4px 8px; font:inherit; font-size:11.5px;
  color:var(--muted); display:flex; flex-direction:column; align-items:center; gap:3px;
}
nav button .ic{font-size:18px; line-height:1}
nav button.on{color:var(--acc); font-weight:600}
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:14px; margin-bottom:12px}
.card h2{margin:0 0 8px; font-size:15px}
.muted{color:var(--muted); font-size:13px}
.chips{display:flex; gap:6px; overflow-x:auto; padding:2px 0 10px; scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  white-space:nowrap; border:1px solid var(--line); background:#fff; color:var(--ink);
  border-radius:999px; padding:7px 13px; font:inherit; font-size:13px;
}
.chip.on{background:var(--blue); color:#fff; border-color:var(--blue)}
.q{background:#fff; border:1px solid var(--line); border-radius:var(--r); margin-bottom:9px; overflow:hidden}
.q>.head{display:flex; gap:10px; padding:12px 13px; cursor:pointer; align-items:flex-start}
.num{
  flex:0 0 26px; height:26px; border-radius:8px; background:#eaf1fb; color:var(--blue);
  font-size:12.5px; font-weight:700; display:flex; align-items:center; justify-content:center;
}
.q>.head .t{font-size:14.5px; font-weight:500}
.q .body{display:none; padding:0 13px 13px 49px; font-size:14px}
.q.open .body{display:block}
.q.open .head{background:#f8fbff}
.lbl{font-size:11px; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); margin:10px 0 4px; font-weight:700}
.lbl.ok{color:var(--ok)} .lbl.bad{color:var(--bad)} .lbl.note{color:var(--gold)}
ul{margin:4px 0 0; padding-left:18px} li{margin:2px 0}
.btn{
  display:inline-block; border:0; border-radius:11px; padding:11px 16px; font:inherit; font-size:14.5px;
  font-weight:600; background:var(--acc); color:#fff;
}
.btn.ghost{background:#fff; color:var(--blue); border:1px solid var(--line)}
.btn.ok{background:var(--ok)} .btn.bad{background:var(--bad)}
.btn.full{display:block; width:100%; text-align:center; margin-top:10px}
.row{display:flex; gap:8px; flex-wrap:wrap}
.grid{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.field{display:flex; flex-direction:column; gap:3px}
.field label{font-size:11.5px; color:var(--muted)}
.field input{
  width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:10px;
  font:inherit; font-size:15px; background:#fff; color:var(--ink);
}
.field input:focus{outline:2px solid #cfe0f8; border-color:var(--acc)}
.big{font-size:22px; font-weight:700}
.stat{background:#f8fbff; border:1px solid var(--line); border-radius:12px; padding:10px 12px}
.stat .k{font-size:11.5px; color:var(--muted)}
.stat .v{font-size:19px; font-weight:700; color:var(--blue)}
.badge{display:inline-block; font-size:11px; padding:3px 8px; border-radius:999px; background:#eaf1fb; color:var(--blue); font-weight:600}
.badge.f{background:#fdeceb; color:var(--bad)}
.badge.g{background:#fbf3e2; color:var(--gold)}
.progress{height:6px; background:#e6edf7; border-radius:99px; overflow:hidden; margin:10px 0}
.progress i{display:block; height:100%; background:var(--acc); width:0; transition:width .25s}
.answer{background:#f8fbff; border-left:3px solid var(--acc); border-radius:8px; padding:10px 12px; margin-top:8px}
textarea{
  width:100%; min-height:78px; padding:10px; border:1px solid var(--line); border-radius:10px;
  font:inherit; font-size:14px; resize:vertical; background:#fff; color:var(--ink);
}
.toast{
  position:fixed; left:50%; transform:translateX(-50%); bottom:88px; z-index:60;
  background:#12233d; color:#fff; padding:10px 14px; border-radius:10px; font-size:13.5px;
  max-width:88vw; opacity:0; pointer-events:none; transition:opacity .2s;
}
.toast.show{opacity:.96}
.hide{display:none !important}
.script{font-size:14.5px; line-height:1.55; white-space:pre-wrap}
a{color:var(--acc)}

.lock{position:fixed; inset:0; z-index:100; background:var(--bg); display:flex; align-items:center; justify-content:center; padding:24px}
.lockbox{background:#fff; border:1px solid var(--line); border-radius:18px; padding:22px; width:100%; max-width:340px; text-align:center; box-shadow:0 8px 30px rgba(13,59,102,.08)}
.lockbox h2{margin:10px 0 0; font-size:17px}
.lockicon{font-size:30px}
.lockbox input{width:100%; padding:12px 14px; border:1px solid var(--line); border-radius:12px; font:inherit; font-size:16px; text-align:center}
</style>
</head>
<body>
<header>
  <h1>Мемо</h1>
  <div class="sub" id="subtitle">вопросы проверки и личная карточка</div>
</header>
<main id="app"></main>
<div id="lock" class="lock">
  <div class="lockbox">
    <div class="lockicon">🔒</div>
    <h2>Мемо</h2>
    <div class="muted" style="margin:6px 0 14px">Введите пароль, чтобы открыть</div>
    <input id="pw" type="password" autocomplete="current-password" placeholder="пароль">
    <button class="btn full" id="unlock">Открыть</button>
    <div id="pwerr" class="muted" style="color:var(--bad); margin-top:8px"></div>
    <div class="muted" style="margin-top:14px; font-size:12px">Пароль запомнится на этом телефоне.</div>
  </div>
</div>
<nav>
  <button data-tab="learn" class="on"><span class="ic">📚</span>Учить</button>
  <button data-tab="check"><span class="ic">✅</span>Проверка</button>
  <button data-tab="card"><span class="ic">🪪</span>Моя карточка</button>
  <button data-tab="rules"><span class="ic">ℹ️</span>Правила</button>
</nav>
<div class="toast" id="toast"></div>
<script src="data.js"></script>
<script>
"use strict";
/* ---------- хранилище ---------- */
var store={
  get:function(k,d){ try{ var v=localStorage.getItem("mchmemo_"+k); return v===null?d:JSON.parse(v); }catch(e){ return d; } },
  set:function(k,v){ try{ localStorage.setItem("mchmemo_"+k, JSON.stringify(v)); }catch(e){} }
};
function toast(msg){
  var t=document.getElementById("toast");
  t.textContent=msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t=setTimeout(function(){ t.classList.remove("show"); },2200);
}
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function nl2html(s){ return esc(s).split("\n").map(function(l){ return l; }).join("<br>"); }
/* пункты ответа: строки, начинающиеся с цифры+точка или "-", превращаем в список */
function fmtAnswer(txt){
  if(!txt) return "";
  var lines=String(txt).split("\n"), out="", inUl=false;
  lines.forEach(function(l){
    var isItem=/^\s*(\d+\.|—|-)\s+/.test(l);
    if(isItem){
      if(!inUl){ out+="<ul>"; inUl=true; }
      out+="<li>"+esc(l.replace(/^\s*(\d+\.|—|-)\s+/,""))+"</li>";
    }else{
      if(inUl){ out+="</ul>"; inUl=false; }
      if(l.trim()) out+="<div>"+esc(l)+"</div>";
    }
  });
  if(inUl) out+="</ul>";
  return out;
}

/* ---------- данные: вопросы ---------- */
var BLOCKS={}, Q=[], CARD_GROUPS=[], FIELDS={};
function setData(d){
  BLOCKS=d.BLOCKS||{}; Q=d.Q||[]; CARD_GROUPS=d.CARD_GROUPS||[];
  FIELDS={};
  CARD_GROUPS.forEach(function(g){ g.items.forEach(function(it){ FIELDS[it.k]=it; }); });
}

function fmtVal(k,v){
  if(v===undefined||v===null||v==="") return "—";
  var it=FIELDS[k];
  var n=parseFloat(String(v).replace(",","."));
  if(isNaN(n)) return String(v);
  if(it&&it.pct) return (Math.round(n*10)/10).toLocaleString("ru-RU")+"%";
  return (Math.round(n*100)/100).toLocaleString("ru-RU");
}
function num(k,store_){
  var v=parseFloat(String(store_[k]==null?"":store_[k]).replace(",","."));
  return isNaN(v)?null:v;
}

/* ---------- экраны ---------- */
var state={tab:"learn", filter:"all", open:{}, check:null};

function renderLearn(){
  var st=store.get("card",{});
  var html="";
  html+='<div class="muted" style="margin:2px 2px 10px">21 вопрос проверки. Блок «Из памятки» — 10 вопросов, дальше по 5/2/2/2. Нажми на вопрос, чтобы увидеть эталонный ответ и как его оценивать.</div>';
  html+='<div class="chips">';
  html+='<button class="chip '+(state.filter==="all"?"on":"")+'" data-f="all">Все · 21</button>';
  Object.keys(BLOCKS).forEach(function(b){
    html+='<button class="chip '+(state.filter===b?"on":"")+'" data-f="'+b+'">'+esc(BLOCKS[b].short)+" · "+BLOCKS[b].n+"</button>";
  });
  html+='</div>';
  Q.filter(function(q){ return state.filter==="all"||q.b===state.filter; }).forEach(function(q){
    var open=!!state.open[q.id];
    var memo=store.get("memos",{});
    var a=q.a;
    if(q.memo&&memo[q.memo]) a=memo[q.memo];
    html+='<div class="q '+(open?"open":"")+'" data-q="'+q.id+'">';
    html+='<div class="head"><div class="num">'+q.id+'</div><div class="t">'+esc(q.t)+"</div></div>";
    html+='<div class="body">';
    html+='<div class="lbl">Эталонный ответ</div><div class="answer">'+fmtAnswer(a)+"</div>";
    if(q.memo){
      html+='<div class="lbl note">Памятка не заполнена — впиши критерии один раз</div>';
      html+='<textarea data-memo="'+q.memo+'" placeholder="Критерии из памятки, каждый с новой строки">'+esc(memo[q.memo]||"")+"</textarea>";
      html+='<button class="btn ghost" data-savememo="'+q.memo+'">Сохранить в памятку</button>';
    }
    if(q.c1){ html+='<div class="lbl ok">1 балл</div><div>'+fmtAnswer(q.c1)+"</div>"; }
    if(q.c0){ html+='<div class="lbl bad">0 баллов</div><div>'+fmtAnswer(q.c0)+"</div>"; }
    if(q.note){ html+='<div class="lbl note">На заметку</div><div>'+fmtAnswer(q.note)+"</div>"; }
    if(q.personal){ html+='<div class="lbl">Твои цифры</div><div class="muted">'+(cardLineFor(q.id,st)||"Заполни карточку — здесь появятся твои цифры.")+"</div>"; }
    html+='</div></div>';
  });
  return html;
}

function cardLineFor(id,st){
  function g(k){ var v=num(k,st); return v===null?"—":fmtVal(k,st[k]); }
  if(id===3) return "ТИМ участие: МК — "+g("tim_mk")+", ММ — "+g("tim_mm");
  if(id===5) return "Магнит КМ: платина "+g("mk_plat")+", золото "+g("mk_gold")+", серебро "+g("mk_silver");
  if(id===6) return "Магнит ММ: платина "+g("mm_plat")+", золото "+g("mm_gold")+", серебро "+g("mm_silver");
  if(id===7) return "Перекрёсток — смотри выгрузку ЦАП: в одностраничнике этой сети нет";
  if(id===8) return "Нарушители всего "+g("v_total")+" (устранено "+g("v_fixed")+", новые "+g("v_new")+"); МК "+g("mkv_gold")+"/"+g("mkv_silver")+" (золото/серебро), ДК "+g("mdkv_gold")+"/"+g("mdkv_silver")+", Дикси "+g("dxv_gold")+"/"+g("dxv_silver");
  if(id===9) return "IR в месяц "+g("ir")+", ФТЕ "+g("fte");
  if(id===10) return "План инвентаризаций в месяц "+g("inv_month");
  if(id===18) return "Качество "+g("quality")+", выплата "+g("payout");
  return "";
}

/* ---------- проверка ---------- */
function startCheck(){
  var pam=Q.filter(function(q){ return q.b==="pam"; });
  var pick=[];
  var copy=pam.slice();
  for(var i=0;i<3;i++){ pick.push(copy.splice(Math.floor(Math.random()*copy.length),1)[0]); }
  ["fraud","quality","grade","prio"].forEach(function(b){
    var arr=Q.filter(function(q){ return q.b===b; });
    pick.push(arr[Math.floor(Math.random()*arr.length)]);
  });
  state.check={list:pick, i:0, res:[], revealed:false};
  store.set("checkstate",state.check);
  render();
}
function renderCheck(){
  var c=state.check;
  if(!c){
    return '<div class="card"><h2>Проверка МЧ</h2>'+
      '<div class="muted">7 вопросов: 3 из памятки и по одному из блоков ФРОД, качество, грейды, приоритеты выкладки. Каждый вопрос — 0,5 балла, максимум 3,5.</div>'+
      '<button class="btn full" id="startcheck">Начать проверку</button></div>'+
      '<div class="card"><h2>Кого проверяем</h2><div class="muted">Выделенный МЧ, больше 3 месяцев на проекте, от 0,5 ФТЕ, по возможности без ГМ (исключение — СВ ГМ). У каждого СВ минимум 2 МЧ.</div></div>';
  }
  if(c.i>=c.list.length) return renderCheckResult();
  var q=c.list[c.i];
  var html="";
  html+='<div class="card"><div class="muted">Вопрос '+(c.i+1)+" из "+c.list.length+' · '+esc(BLOCKS[q.b].short)+'</div>';
  html+='<div class="progress"><i style="width:'+(c.i/c.list.length*100)+'%"></i></div>';
  html+='<div style="font-size:16px;font-weight:600;margin:6px 0 2px">'+esc(q.t)+"</div>";
  if(q.personal){ var line=cardLineFor(q.id,store.get("card",{})); if(line) html+='<div class="muted" style="margin-top:6px">Свои цифры: '+esc(line)+"</div>"; }
  if(!c.revealed){
    html+='<button class="btn full ghost" id="reveal">Показать эталон</button>';
  }else{
    var memo=store.get("memos",{});
    var a=(q.memo&&memo[q.memo])?memo[q.memo]:q.a;
    html+='<div class="lbl">Эталон</div><div class="answer">'+fmtAnswer(a)+"</div>";
    if(q.c1) html+='<div class="lbl ok">1 балл</div><div>'+fmtAnswer(q.c1)+"</div>";
    if(q.c0) html+='<div class="lbl bad">0 баллов</div><div>'+fmtAnswer(q.c0)+"</div>";
    if(q.note) html+='<div class="lbl note">На заметку</div><div>'+fmtAnswer(q.note)+"</div>";
    html+='<div class="row" style="margin-top:12px"><button class="btn ok" style="flex:1" data-score="1">Ответил · 1 балл</button><button class="btn bad" style="flex:1" data-score="0">Не ответил · 0</button></div>';
  }
  html+="</div>";
  return html;
}
function renderCheckResult(){
  var c=state.check;
  var sum=c.res.reduce(function(s,x){ return s+x.s; },0);
  var score=(sum*0.5).toLocaleString("ru-RU");
  var bad=c.res.filter(function(x){ return x.s===0; });
  var html='<div class="card"><h2>Итог</h2><div class="big">'+score+" / 3,5</div>";
  html+='<div class="muted" style="margin-top:6px">Правильно: '+sum+" из 7 вопросов.</div>";
  html+="</div>";
  html+='<div class="card"><h2>Что повторить</h2>';
  if(!bad.length) html+='<div class="muted">Все вопросы закрыты. Так держать.</div>';
  bad.forEach(function(x){
    html+='<div style="padding:8px 0;border-bottom:1px solid var(--line)"><b>Вопрос '+x.id+".</b> "+esc(x.t)+'<div class="muted" style="margin-top:3px">Блок: '+esc(BLOCKS[x.b].short)+"</div></div>";
  });
  html+="</div>";
  html+='<div class="row"><button class="btn" id="startcheck">Ещё раз</button><button class="btn ghost" id="clearchck">Сбросить</button></div>';
  return html;
}

/* ---------- карточка ---------- */
function renderCard(){
  var st=store.get("card",{});
  var html="";
  html+='<div class="card"><h2>Моя карточка</h2>'+
    '<div class="muted">Данные хранятся только в этом телефоне и никуда не отправляются. Заполни один раз — вопросы в разделе «Учить» и «Проверка» сразу подставят твои цифры.</div>'+
    '<div class="field" style="margin-top:10px"><label>ФИО</label><input id="fio" value="'+esc(st.fio||"")+'" placeholder="Фамилия Имя Отчество"></div>'+
    '<div class="field" style="margin-top:8px"><label>Мой супервайзер</label><input id="sv" value="'+esc(st.sv||"")+'" placeholder="ФИО СВ"></div>'+
    '<label class="btn full ghost" style="position:relative;overflow:hidden">Загрузить одностраничник (xlsx)'+
      '<input type="file" id="xlsx" accept=".xlsx" style="position:absolute;inset:0;opacity:0;width:100%"></label>'+
    '<div class="muted" style="margin-top:8px">Файл разбирается прямо в телефоне — интернет не нужен, данные никуда не уходят.</div>'+
    "</div>";
  CARD_GROUPS.forEach(function(g){
    html+='<div class="card"><h2>'+esc(g.g)+"</h2><div class=\"grid\">";
    g.items.forEach(function(it){
      html+='<div class="field"><label>'+esc(it.l)+'</label><input data-k="'+it.k+'" inputmode="decimal" value="'+esc(st[it.k]==null?"":st[it.k])+'"></div>';
    });
    html+="</div></div>";
  });
  html+='<div class="card"><h2>Как рассказать о себе</h2><div class="muted">Собирается из твоих цифр. Сначала коротко, потом пройди по блокам.</div><div class="script" id="script" style="margin-top:10px">'+esc(buildScript(st))+"</div>"+
    '<button class="btn full ghost" id="copyscript">Скопировать текст</button></div>';
  html+='<div class="card"><button class="btn full bad" id="resetcard">Очистить карточку</button></div>';
  return html;
}
function buildScript(st){
  var fio=st.fio||"…", sv=st.sv||"…";
  function g(k){ var v=num(k,st); return v===null?"…":fmtVal(k,st[k]); }
  var s="Меня зовут "+fio+", мой супервайзер — "+sv+".\n";
  s+="Стаж на проекте — "+g("stazh")+" месяцев, на маршруте "+g("tt_total")+" торговых точек, ФТЕ "+g("fte")+".\n";
  s+="KPI: визитность "+g("viz")+" при плане 98%, инвентаризация "+g("inv")+" при плане 98%, OSA oral-B "+g("osa")+", доля прикассы oral-B "+g("sho")+".\n";
  s+="Вес KPI: визитность 15%, инвентаризация 15%, ИР орал 15%.\n";
  s+="Грейды: качество "+g("quality")+", выплата "+g("payout")+".\n";
  s+="ФРОД за период — "+g("frod")+".\n";
  s+="Инвентаризаций в месяц по плану — "+g("inv_month")+", ТТ с ИР — "+g("ir")+" в месяц.\n";
  s+="Сети: Магнит Косметик — платина "+g("mk_plat")+", золото "+g("mk_gold")+", серебро "+g("mk_silver")+"; Магнит Минимаркет — платина "+g("mm_plat")+", золото "+g("mm_gold")+", серебро "+g("mm_silver")+".\n";
  s+="ТИМ-программы закрыты: МК — "+g("tim_mk")+" ТТ, ММ — "+g("tim_mm")+" ТТ.\n";

  s+="\nЗаработок: оклад 70%, KPI 30%, грейды с процентом, ТИМ.";
  return s;
}

/* ---------- разбор xlsx в браузере ---------- */
function unzip(buf){
  var u8=new Uint8Array(buf), dv=new DataView(buf), eocd=-1;
  for(var i=u8.length-22;i>=Math.max(0,u8.length-66000);i--){
    if(dv.getUint32(i,true)===0x06054b50){ eocd=i; break; }
  }
  if(eocd<0) throw new Error("это не xlsx");
  var count=dv.getUint16(eocd+10,true), ofs=dv.getUint32(eocd+16,true), p=ofs, files={};
  for(var n=0;n<count;n++){
    if(dv.getUint32(p,true)!==0x02014b50) break;
    var method=dv.getUint16(p+10,true), csize=dv.getUint32(p+20,true),
        nameLen=dv.getUint16(p+28,true), extraLen=dv.getUint16(p+30,true),
        cmtLen=dv.getUint16(p+32,true), lho=dv.getUint32(p+42,true);
    var name=new TextDecoder("utf-8").decode(u8.subarray(p+46,p+46+nameLen));
    var lNameLen=dv.getUint16(lho+26,true), lExtraLen=dv.getUint16(lho+28,true);
    var start=lho+30+lNameLen+lExtraLen;
    files[name]={method:method, data:u8.subarray(start,start+csize)};
    p+=46+nameLen+extraLen+cmtLen;
  }
  return files;
}
function fileText(entry){
  if(!entry) return Promise.resolve("");
  if(entry.method===0) return Promise.resolve(new TextDecoder("utf-8").decode(entry.data));
  if(typeof DecompressionStream==="undefined") return Promise.reject(new Error("браузер старый"));
  var stream=new Blob([entry.data]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
  return new Response(stream).text();
}
function xmlDoc(text){ return new DOMParser().parseFromString(text,"application/xml"); }
function tNodes(el){
  var out="", ts=el.getElementsByTagNameNS("*","t");
  for(var i=0;i<ts.length;i++) out+=ts[i].textContent;
  return out;
}
function parseXlsxCells(buf){
  var files=unzip(buf);
  var jobs=[
    fileText(files["xl/workbook.xml"]),
    fileText(files["xl/_rels/workbook.xml.rels"]),
    fileText(files["xl/sharedStrings.xml"]) || Promise.resolve("")
  ];
  return Promise.all(jobs).then(function(res){
    var wbDoc=xmlDoc(res[0]), relDoc=xmlDoc(res[1]), ssText=res[2]||"";
    var sheets=wbDoc.getElementsByTagNameNS("*","sheet");
    var target=null, rid=null;
    for(var i=0;i<sheets.length;i++){
      var nm=sheets[i].getAttribute("name")||"";
      if(/страничник/i.test(nm)){ target=nm; rid=sheets[i].getAttribute("r:id")||sheets[i].getAttributeNS("http://schemas.openxmlformats.org/officeDocument/2006/relationships","id"); break; }
    }
    if(!target && sheets.length){
      target=sheets[0].getAttribute("name")||"";
      rid=sheets[0].getAttribute("r:id");
    }
    var path=null, rels=relDoc.getElementsByTagNameNS("*","Relationship");
    for(var j=0;j<rels.length;j++){
      if(rels[j].getAttribute("Id")===rid){
        var t=rels[j].getAttribute("Target");
        path=/^\//.test(t)? t.slice(1) : "xl/"+t.replace(/^xl\//,"");
      }
    }
    if(!path) path="xl/worksheets/sheet1.xml";
    var ss=[];
    if(ssText){
      var d=xmlDoc(ssText), si=d.getElementsByTagNameNS("*","si");
      for(var s=0;s<si.length;s++) ss.push(tNodes(si[s]));
    }
    return fileText(files[path]).then(function(sheetText){
      if(!sheetText) throw new Error("лист не найден");
      var doc=xmlDoc(sheetText), cells={}, cs=doc.getElementsByTagNameNS("*","c");
      for(var c=0;c<cs.length;c++){
        var ref=cs[c].getAttribute("r"), type=cs[c].getAttribute("t");
        var vEl=cs[c].getElementsByTagNameNS("*","v")[0];
        var val=null;
        if(type==="s"&&vEl){ val=ss[parseInt(vEl.textContent,10)]; }
        else if(type==="inlineStr"){ val=tNodes(cs[c]); }
        else if(vEl){ val=vEl.textContent; }
        if(val!==null&&val!=="") cells[ref]=val;
      }
      return {sheet:target, cells:cells};
    });
  });
}
function importCard(cells){
  function g(ref, scale){
    var v=cells[ref];
    if(v===undefined||v===null||v==="") return undefined;
    var n=parseFloat(String(v).replace(",","."));
    if(isNaN(n)) return undefined;
    n=Math.round(n*10000)/10000;
    if(scale) n=Math.round(n*scale*10)/10;
    return n;
  }
  var st=store.get("card",{});
  function set(k,ref,scale){ var v=g(ref,scale); if(v!==undefined) st[k]=v; }
  if(cells["H2"]) st.fio=String(cells["H2"]).trim();
  if(cells["H3"]) st.sv=String(cells["H3"]).trim();
  set("stazh","F6"); set("ir","K6");
  set("viz","C10",100); set("inv","D10",100); set("osa","E10",100); set("sho","F10",100);
  set("quality","D13",100); set("payout","F13");
  set("frod","F17"); set("fte","F20"); set("inv_month","F23");
  set("tt_total","K9");
  set("tim_mk","I12"); set("mk_total","I11"); set("mk_plat","I13"); set("mk_gold","I14"); set("mk_silver","I15");
  set("tim_mm","K12"); set("mm_total","K11"); set("mm_plat","K13"); set("mm_gold","K14"); set("mm_silver","K15");
  set("v_total","I18"); set("v_fixed","J18"); set("v_new","K18");
  set("mkv_plat","I22"); set("mkv_gold","I23"); set("mkv_silver","I24"); set("mkv_other","I25");
  set("mdkv_plat","I27"); set("mdkv_gold","I28"); set("mdkv_silver","I29"); set("mdkv_other","I30");
  set("dxv_plat","I32"); set("dxv_gold","I33"); set("dxv_silver","I34"); set("dxv_other","I35");
  store.set("card",st);
  return {fio:st.fio, n:Object.keys(st).filter(function(k){ return st[k]!==""&&st[k]!=null; }).length};
}

/* ---------- рендер ---------- */
function render(){
  var app=document.getElementById("app");
  var html="";
  if(state.tab==="learn") html=renderLearn();
  else if(state.tab==="check") html=renderCheck();
  else if(state.tab==="card") html=renderCard();
  else html=renderRules();
  app.innerHTML=html;
  var st=store.get("card",{});
  document.getElementById("subtitle").textContent = st.fio? st.fio : "вопросы проверки и личная карточка";
  Array.prototype.forEach.call(document.querySelectorAll("nav button"),function(b){
    b.classList.toggle("on", b.getAttribute("data-tab")===state.tab);
  });
}
document.addEventListener("click",function(e){
  var t=e.target.closest ? e.target.closest("[data-f],[data-q],[data-tab],[data-score],[data-savememo],#startcheck,#reveal,#resetcard,#copyscript,#clearchck") : null;

  }
  if(t.hasAttribute("data-f")){ state.filter=t.getAttribute("data-f"); render(); return; }
  if(t.hasAttribute("data-q")){
    if(!e.target.closest(".head")) return;
    var id=t.getAttribute("data-q"); state.open[id]=!state.open[id]; render(); return;
  }
  if(t.hasAttribute("data-savememo")){
    var key=t.getAttribute("data-savememo");
    var ta=t.parentNode.querySelector('textarea[data-memo="'+key+'"]');
    var memos=store.get("memos",{}); memos[key]=ta?ta.value:""; store.set("memos",memos);
    toast("Памятка сохранена"); render(); return;
  }
  if(t.id==="startcheck"){ startCheck(); return; }
  if(t.id==="clearchck"){ state.check=null; store.set("checkstate",null); render(); return; }
  if(t.id==="reveal"){ state.check.revealed=true; render(); return; }
  if(t.hasAttribute("data-score")){
    var c=state.check, q=c.list[c.i];
    c.res.push({id:q.id,t:q.t,b:q.b,s:parseInt(t.getAttribute("data-score"),10)});
    c.i++; c.revealed=false; store.set("checkstate",c); render(); window.scrollTo(0,0); return;
  }
  if(t.id==="resetcard"){
    if(confirm("Очистить карточку на этом телефоне?")){ store.set("card",{}); toast("Карточка очищена"); render(); }
    return;
  }
  if(t.id==="copyscript"){
    var txt=document.getElementById("script").textContent;
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(function(){ toast("Текст скопирован"); }); }
    else toast("Выдели текст и скопируй вручную");
    return;
  }
});
document.addEventListener("input",function(e){
  var t=e.target;
  if(t.hasAttribute&&t.hasAttribute("data-k")){
    var st=store.get("card",{}); st[t.getAttribute("data-k")]=t.value; store.set("card",st);

document.addEventListener("change",function(e){
  if(e.target&&e.target.id==="xlsx"){
    var f=e.target.files&&e.target.files[0];
    if(!f) return;
    var fr=new FileReader();
    fr.onload=function(){
      try{
        parseXlsxCells(fr.result).then(function(res){
          var info=importCard(res.cells);
          toast("Загружено: "+(info.fio||"карточка")+" · лист «"+res.sheet+"»");
          render();
        }).catch(function(err){ toast("Не разобрал файл: "+err.message+". Заполни поля руками."); });
      }catch(err){ toast("Не разобрал файл: "+err.message); }
    };
    fr.readAsArrayBuffer(f);
  }
});
/* ---------- замок ---------- */
var PW_KEY="mchmemo_pw", booted=false;
function b64d(s){ var bin=atob(s), u8=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i); return u8; }
function boot(){
  if(booted) return; booted=true;
  var saved=store.get("checkstate",null);
  if(saved&&saved.list&&saved.list.length===7) state.check=saved;
  render();
  if("serviceWorker" in navigator){
    window.addEventListener("load",function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
  }
}
function decryptData(pw){
  var L=window.__LOCK;
  if(!L) return Promise.reject(new Error("нет данных"));
  var enc=new TextEncoder();
  return window.crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]).then(function(base){
    return window.crypto.subtle.deriveKey(
      {name:"PBKDF2", salt:b64d(L.salt), iterations:L.iter, hash:"SHA-256"},
      base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  }).then(function(key){
    return window.crypto.subtle.decrypt({name:"AES-GCM", iv:b64d(L.iv)}, key, b64d(L.data));
  }).then(function(buf){ return JSON.parse(new TextDecoder().decode(buf)); });
}
function unlock(pw, silent){
  var err=document.getElementById("pwerr");
  if(err) err.textContent="";
  return decryptData(pw).then(function(d){
    setData(d);
    try{ localStorage.setItem(PW_KEY, pw); }catch(e){}
    var lock=document.getElementById("lock");
    if(lock) lock.classList.add("hide");
    boot();
    return true;
  }).catch(function(){
    if(!silent&&err) err.textContent="Пароль не подошёл";
    return false;
  });
}
(function(){
  var btn=document.getElementById("unlock"), inp=document.getElementById("pw");
  function go(){ var pw=inp.value.trim(); if(!pw) return; unlock(pw,false); }
  if(btn) btn.addEventListener("click", go);
  if(inp) inp.addEventListener("keydown", function(e){ if(e.key==="Enter") go(); });
  var saved=null;
  try{ saved=localStorage.getItem(PW_KEY); }catch(e){}
  if(saved){ unlock(saved,true); }
})();
